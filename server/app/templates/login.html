{% extends "base.html" %}
{% from "macros.html" import field %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Sign in</h1>
        <form method="post" novalidate>
          {{ form.hidden_tag() }}
          {{ field(form.username) }}
          {{ field(form.password) }}
          <button class="btn btn-primary w-100 mt-2" type="submit">Sign in</button>
        </form>
      </div>
    </div>
    <p class="text-muted small mt-3 text-center">Access is logged. Accounts lock temporarily after repeated failures.</p>
  </div>
</div>
{% endblock %}
